[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-kit"
version = "0.1.0"
description = "Reusable data-science utility modules."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas",
    "numpy",
    "matplotlib",
    "seaborn",
]

[project.urls]
Homepage = "https://github.com/FedericoDelussu/data-science-kit"

[tool.setuptools]
# Ship only the `utils` package; keep the existing folder layout untouched.
packages = ["utils"]
